name: api-clientes

services:

  # BANCO DE DADOS MYSQL
  mysql:
    image: mysql:8.4
    container_name: api-clientes-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bd-clientes
      MYSQL_USER: coti
      MYSQL_PASSWORD: coti

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - rede-clientes

    restart: unless-stopped

    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" -e "SELECT 1" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # PHPMYADMIN
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: api-clientes-phpmyadmin

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    ports:
      - "5052:80"

    depends_on:
      mysql:
        condition: service_healthy

    volumes:
      - phpmyadmin_data:/sessions

    networks:
      - rede-clientes

    restart: unless-stopped

    healthcheck:
      test:
        - CMD-SHELL
        - "php -r 'exit(@file_get_contents(\"http://127.0.0.1/\") === false ? 1 : 0);'"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s


# VOLUMES
volumes:
  mysql_data:
  phpmyadmin_data:


# REDE COMPARTILHADA
networks:
  rede-clientes:
    driver: bridge